<!doctype html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimnàs"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEEF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0D1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>Registre de gimnàs</title>
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format('woff2')}

/* Layout: una columna d'ús amb una mà; targetes grans, barra de pestanyes baixa, cronòmetre de descans flotant. */
:root{
  --bg:#ECEEEF; --surface:#FFFFFF; --surface2:#F2F4F5; --ink:#12181B; --muted:#5A676F; --line:#D3D9DD;
  --accent:#2446E0; --on-accent:#FFFFFF;
  --good:#146F36; --good-bg:#DAF1E2;
  --warn:#8A5200; --warn-bg:#F9E9C8;
  --info:#15597F; --info-bg:#D8E8F3;
  --bad:#B3261E; --bad-bg:#F8DDDB;
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1114; --surface:#161C20; --surface2:#1E262B; --ink:#EDF0F1; --muted:#93A1A9; --line:#2A353B;
    --accent:#7F95FF; --on-accent:#0A1030;
    --good:#55D186; --good-bg:#12301F;
    --warn:#F0B64F; --warn-bg:#37290C;
    --info:#6DB7E8; --info-bg:#112838;
    --bad:#FF8F86; --bad-bg:#3A1917;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1114; --surface:#161C20; --surface2:#1E262B; --ink:#EDF0F1; --muted:#93A1A9; --line:#2A353B;
  --accent:#7F95FF; --on-accent:#0A1030;
  --good:#55D186; --good-bg:#12301F;
  --warn:#F0B64F; --warn-bg:#37290C;
  --info:#6DB7E8; --info-bg:#112838;
  --bad:#FF8F86; --bad-bg:#3A1917;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.35 var(--f-body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 170px}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small{font-size:13px}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:30px;line-height:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync.ok i{background:var(--good)} .sync.wait i{background:var(--warn)} .sync.err i{background:var(--bad)}

/* selector de setmana i sessió */
.wk{display:flex;align-items:center;gap:8px}
.wk .lbl{flex:1;text-align:center;font-family:var(--f-disp);font-size:26px;font-weight:600;line-height:1}
.wk .lbl small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.sq{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sq:disabled{opacity:.35}
.sq svg,.rb svg,.ck svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 8px;background:var(--surface2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:10px;min-height:48px;font:600 17px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--muted)}
.seg button small{font-weight:500;font-size:12px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:14px}
.meta .t{min-width:0}
.date{position:relative;flex:none}
.date input{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:40px;max-width:150px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:var(--info-bg);color:var(--info);font-weight:500}
.jump{width:100%;min-height:48px;border-radius:12px;border:1px dashed var(--accent);background:none;color:var(--accent);font-weight:600;margin-bottom:12px}

/* xips de resultat */
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.c-puja{background:var(--good-bg);color:var(--good)}
.c-mantin{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.c-inc{background:var(--warn-bg);color:var(--warn)}
.c-desc{background:var(--info-bg);color:var(--info)}
.c-gray{background:var(--surface2);color:var(--muted)}

/* targeta d'exercici */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ex.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.exh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left;min-height:64px}
.idx{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 18px var(--f-disp);background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.idx svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ex.done .idx{background:var(--accent);color:var(--on-accent);box-shadow:none}
.exn{flex:1;min-width:0;display:flex;flex-direction:column}
.exn b{font:600 21px/1.05 var(--f-disp);letter-spacing:.01em}
.exn small{color:var(--muted);margin-top:3px}
.exb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.ref{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ref b{color:var(--ink);font-weight:600}
.hint{font-size:14px;border-radius:10px;padding:8px 10px;background:var(--surface2);color:var(--ink)}
.hint.good{background:var(--good-bg);color:var(--good);font-weight:500}
.hint.info{background:var(--info-bg);color:var(--info);font-weight:500}
.wrow{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.rb{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.rb:active{background:var(--line)}
.wval{height:56px;border:0;background:none;font:600 44px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-align:center;border-radius:12px}
.wval small{font:500 16px var(--f-body);color:var(--muted);margin-left:4px}
.winp{width:100%;height:56px;border:2px solid var(--accent);border-radius:12px;background:var(--surface);text-align:center;font:600 40px var(--f-disp);min-width:0}
.bwnote{font-size:14px;color:var(--muted);text-align:center}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:54px 56px 1fr 56px 56px;gap:8px;align-items:center}
.sl{font-size:13px;color:var(--muted);font-weight:500;line-height:1.1}
.set .rb{height:52px}
.rv{text-align:center;font:600 38px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.rv.ghost{color:var(--muted);opacity:.55}
.rv small{display:block;font:500 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:1;margin-top:1px}
.ck{width:56px;height:52px;border-radius:14px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted)}
.set.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;min-height:44px;color:var(--ink)}
.note::placeholder{color:var(--muted)}

.done-card{background:var(--surface);border:1px solid var(--good);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.done-card h3{font-size:26px;color:var(--good)}
.btn{min-height:50px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 16px}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}

/* cronòmetre de descans */
#rest{position:fixed;left:0;right:0;margin-inline:auto;width:calc(100% - 24px);max-width:536px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--on-accent);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#rest.fin{background:var(--good);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #rest.fin{color:#04210F}}
:root[data-theme="dark"] #rest.fin{color:#04210F}
#rest .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.18);transition:width .25s linear}
#rest .row{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px}
#rest .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.85;line-height:1.1}
#rest .t{font:600 38px/1 var(--f-disp);font-variant-numeric:tabular-nums;flex:1}
#rest button{min-width:52px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:inherit;font-weight:600}

/* pestanyes */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
.tabs div{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--accent)}

/* progrés */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.sec{font:600 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.ph{width:100%;display:flex;align-items:flex-start;gap:10px;justify-content:space-between;background:none;border:0;padding:0;text-align:left}
.ph b{font:600 21px/1.05 var(--f-disp)}
.ph .v{font:600 30px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ph .v small{font:500 13px var(--f-body);color:var(--muted)}
.spark{width:100%;height:auto;display:block;margin:8px 0 2px}
.spark text{fill:var(--muted);font:500 9px var(--f-body)}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .band{fill:var(--info-bg)}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .pt{stroke:var(--surface);stroke-width:2}
.pt.p-puja{fill:var(--good)} .pt.p-mantin{fill:var(--ink)} .pt.p-inc{fill:var(--warn)} .pt.p-desc{fill:var(--info)}
.cap{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px}
td{padding:8px 4px;border-top:1px solid var(--line)}
.tw{overflow-x:auto;margin-top:8px}

/* setmanes */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px}
.stat b{display:block;font:600 32px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.15;display:block;margin-top:4px}
.wcard.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wtop h3{font-size:24px;line-height:1.05;white-space:nowrap}
.wtop small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-top:2px}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.wb{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:600}
.wb small{font-weight:500;color:var(--muted)}
.wb.sí{background:var(--good-bg);border-color:transparent;color:var(--good)} .wb.sí small{color:inherit}
.wb.mínima{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .wb.mínima small{color:inherit}

/* dades */
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1 1 140px}
.pill{min-height:44px;min-width:64px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.pill[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.field input[type=date]{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);min-height:44px}
.sw{width:56px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--accent)} .sw[aria-checked=true]::after{transform:translateX(24px)}
.how p{margin:0 0 8px;font-size:15px}
.how p:last-child{margin:0}
.msg{font-size:14px;margin-top:8px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){.set{grid-template-columns:44px 52px 1fr 52px 52px;gap:6px}.ck{width:52px}.rb{height:52px}}
</style></head><body>

<div class="wrap" id="view"></div>

<div id="rest" hidden>
  <div class="fill"></div>
  <div class="row">
    <div class="l">Descans</div>
    <div class="t" id="rest-t">1:30</div>
    <button data-act="rest-sub" aria-label="15 segons menys">−15</button>
    <button data-act="rest-add" aria-label="15 segons més">+15</button>
    <button data-act="rest-skip">Salta</button>
  </div>
</div>

<nav class="tabs" aria-label="Seccions"><div id="tabs"></div></nav>

<script>
"use strict";
/* ---------- Pla (de l'Excel) ---------- */
const PLAN = {
  A: { name: "Session A", sub: "Vertical pull + shoulders + squat pattern", ex: [
    { id: "lat",  name: "Lat pulldown (neutral grip)",      lo: 8,  hi: 12, inc: 2.5, step: 2.5 },
    { id: "ohp",  name: "Seated dumbbell overhead press",   lo: 8,  hi: 10, inc: 2,   step: 2 },
    { id: "leg",  name: "Leg press",                        lo: 8,  hi: 10, inc: 5,   step: 5 },
    { id: "bss",  name: "Dumbbell Bulgarian split squat",   lo: 8,  hi: 10, inc: 5,   step: 2, side: true },
    { id: "hlr",  name: "Hanging leg raises",               lo: 8,  hi: 12, bw: true }
  ]},
  B: { name: "Session B", sub: "Horizontal push/pull + step-ups + hamstrings", ex: [
    { id: "bench", name: "Barbell bench press",             lo: 6,  hi: 8,  inc: 2.5, step: 2.5 },
    { id: "row",   name: "One-arm dumbbell row",            lo: 8,  hi: 12, inc: 2,   step: 2, side: true },
    { id: "step",  name: "Dumbbell step-downs",             lo: 8,  hi: 10, inc: 5,   step: 2, side: true },
    { id: "curl",  name: "Lying leg curl",                  lo: 10, hi: 12, inc: 5,   step: 2.5 },
    { id: "calf",  name: "Standing calf raise machine",     lo: 12, hi: 15, inc: 5,   step: 5 }
  ]}
};
const SEED = {"logs":{},"weeks":{}};
const KEY = "gymlog.state.v1";
const MONTHS = ["gen","febr","març","abr","maig","juny","jul","ag","set","oct","nov","des"];
const RC = { "Puja": "puja", "Mantín": "mantin", "Incompleta": "inc", "Descàrrega": "desc" };
const ICON = {
  train: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  prog:  '<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/>',
  weeks: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  data:  '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="17" r="2" fill="var(--surface)"/>',
  prev:  '<path d="M15 5l-7 7 7 7"/>',
  next:  '<path d="M9 5l7 7-7 7"/>',
  minus: '<path d="M5 12h14"/>',
  plus:  '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- Utilitats ---------- */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n == null ? "" : String(Math.round(n * 100) / 100).replace(".", ",");
const parseNum = (t) => { const n = parseFloat(String(t).replace(",", ".")); return isFinite(n) ? n : null; };
const toISO = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return toISO(d); };
const fdate = (iso) => { if (!iso) return ""; const p = iso.split("-").map(Number); return p[2] + " " + MONTHS[p[1] - 1]; };
const today = () => toISO(new Date());
const clone = (o) => JSON.parse(JSON.stringify(o));
const isDeload = (w) => w % 4 === 0;
const nSets = (w) => isDeload(w) ? 2 : 3;
const chip = (r) => r ? `<span class="chip c-${RC[r]}">${r}</span>` : "";

/* ---------- Estat i persistència ---------- */
function seedState() {
  const weeks = {};
  Object.keys(SEED.weeks).forEach((k) => { weeks[k] = clone(SEED.weeks[k]); });
  return { v: 1, updatedAt: 1, settings: { start: "2026-09-21", rest: 90, awake: true }, logs: clone(SEED.logs), weeks };
}
function normalize(o) {
  if (!o || typeof o !== "object" || typeof o.logs !== "object") return null;
  o.settings = Object.assign({ start: "2026-09-21", rest: 90, awake: true }, o.settings || {});
  o.weeks = o.weeks || {};
  o.updatedAt = o.updatedAt || 1;
  return o;
}
let st = null;
try { st = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { st = null; }
if (!st) st = seedState();

function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

/* ---------- Dades derivades ---------- */
const getLog = (s, w) => st.logs[s + "-" + w];
const getEntry = (s, w, id) => { const l = getLog(s, w); return l && l.ex ? l.ex[id] : undefined; };
const filled = (e) => e && e.s ? e.s.filter((x) => x != null) : [];
function exName(ex, w) { return ex.id === "step" && w === 1 ? "Dumbbell step-ups (caixa alta)" : ex.name; }
function result(e, ex, w) {
  const f = filled(e);
  if (!f.length) return "";
  if (isDeload(w)) return "Descàrrega";
  if (f.length < 3) return "Incompleta";
  return Math.min.apply(null, f) >= ex.hi ? "Puja" : "Mantín";
}
function reference(s, ex, w) {
  for (let k = w - 1; k >= 1; k--) {
    if (isDeload(k)) continue;
    const e = getEntry(s, k, ex.id);
    if (filled(e).length) return { week: k, e, res: result(e, ex, k) };
  }
  return null;
}
function suggestWeight(s, ex, w) {
  if (ex.bw) return null;
  const r = reference(s, ex, w);
  if (!r || r.e.w == null) return null;
  if (isDeload(w)) return r.e.w;
  return r.res === "Puja" ? Math.round((r.e.w + ex.inc) * 100) / 100 : r.e.w;
}
function curWeight(s, ex, w) {
  const e = getEntry(s, w, ex.id);
  return e && e.w != null ? e.w : suggestWeight(s, ex, w);
}
function defReps(s, ex, w, i) {
  const e = getEntry(s, w, ex.id);
  if (i > 0 && e && e.s[i - 1] != null) return e.s[i - 1];
  const r = reference(s, ex, w);
  if (r) {
    const cw = curWeight(s, ex, w);
    const heavier = !ex.bw && cw != null && r.e.w != null && cw > r.e.w;
    if (heavier) return ex.lo;
    const v = r.e.s[i] != null ? r.e.s[i] : r.e.s[0];
    return v != null ? v : ex.hi;
  }
  return ex.hi;
}
const exDone = (s, ex, w) => filled(getEntry(s, w, ex.id)).length >= nSets(w);
const sessionCount = (s, w) => PLAN[s].ex.filter((ex) => filled(getEntry(s, w, ex.id)).length > 0).length;
const sessionDone = (s, w) => PLAN[s].ex.every((ex) => exDone(s, ex, w));
function nextPending() {
  let last = 0;
  for (let w = 1; w <= 12; w++) ["A", "B"].forEach((s, i) => { if (sessionCount(s, w) > 0) last = (w - 1) * 2 + i + 1; });
  if (last > 0) {
    const ls = ["A", "B"][(last - 1) % 2], lw = Math.floor((last - 1) / 2) + 1, lg = getLog(ls, lw);
    if (lg && lg.date === today() && !sessionDone(ls, lw)) return { s: ls, w: lw };
  }
  if (last >= 24) return null;
  return { s: ["A", "B"][last % 2], w: Math.floor(last / 2) + 1 };
}
function weekStatus(w) {
  const a = sessionCount("A", w), b = sessionCount("B", w);
  const sa = a === 0 ? "" : a <= 3 ? "Mínima" : "Sí";
  const sb = b === 0 ? "" : b <= 3 ? "Mínima" : "Sí";
  const done = [sa, sb].filter((x) => x === "Sí" || x === "Mínima").length;
  const wk = st.weeks[w] || {};
  let estat = "";
  if (!(done === 0 && !wk.eixida)) estat = done >= 2 ? "Objectiu assolit" : done === 1 ? "Parcial" : "Cap sessió";
  return { sa, sb, done, estat, eixida: !!wk.eixida, notes: wk.notes || "" };
}
const weekStart = (w) => addDays(st.settings.start, 7 * (w - 1));
function currentWeek() {
  const d = Math.floor((new Date(today() + "T12:00:00") - new Date(st.settings.start + "T12:00:00")) / 86400000);
  return Math.min(12, Math.max(1, Math.floor(d / 7) + 1));
}

/* ---------- Mutacions ---------- */
let view = { tab: "train", s: "A", w: 1, open: null, editW: null, prog: null };
function mutate(fn, opts) {
  fn(st);
  st.updatedAt = Date.now();
  saveLocal();
  scheduleCloud();
  if (!opts || opts.render !== false) render();
}
function ensureEntry(s, w, ex) {
  const k = s + "-" + w;
  if (!st.logs[k]) st.logs[k] = { date: today(), ex: {} };
  const l = st.logs[k];
  if (!l.date) l.date = today();
  if (!l.ex[ex.id]) {
    l.ex[ex.id] = { s: [null, null, null] };
    if (!ex.bw) { const cw = curWeight(s, ex, w); if (cw != null) l.ex[ex.id].w = cw; }
  }
  const e = l.ex[ex.id];
  while (e.s.length < 3) e.s.push(null);
  return e;
}
const findEx = (id) => { for (const s of ["A", "B"]) { const ex = PLAN[s].ex.find((x) => x.id === id); if (ex) return ex; } };

function setReps(id, i, mode, delta) {
  const { s, w } = view, ex = findEx(id);
  const wasEmpty = (() => { const e = getEntry(s, w, id); return !e || e.s[i] == null; })();
  const base = defReps(s, ex, w, i);
  let started = false;
  mutate(() => {
    const e = ensureEntry(s, w, ex);
    if (mode === "ck") {
      if (e.s[i] == null) { e.s[i] = base; started = true; } else e.s[i] = null;
    } else {
      const cur = e.s[i] == null ? base : e.s[i];
      const nv = cur + delta;
      if (nv < 1) e.s[i] = null; else { e.s[i] = Math.min(99, nv); if (wasEmpty) started = true; }
    }
  });
  if (started) afterLogged(s, w, ex);
}
function afterLogged(s, w, ex) {
  unlockAudio();
  const sessionFinished = sessionDone(s, w);
  if (!sessionFinished) startRest(st.settings.rest);
  else stopRest();
  if (exDone(s, ex, w)) {
    const nxt = PLAN[s].ex.find((x) => !exDone(s, x, w));
    setTimeout(() => {
      view.open = nxt ? nxt.id : null;
      render();
      const el = document.querySelector(nxt ? `[data-card="${nxt.id}"]` : ".done-card");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 450);
  }
}
function stepWeight(id, dir) {
  const { s, w } = view, ex = findEx(id);
  mutate(() => {
    const e = ensureEntry(s, w, ex);
    const base = e.w != null ? e.w : 0;
    e.w = Math.max(0, Math.round((base + dir * ex.step) * 100) / 100);
  });
}
function commitWeight(id, text) {
  const { s, w } = view, ex = findEx(id);
  const n = parseNum(text);
  view.editW = null;
  mutate(() => {
    if (n != null && n >= 0) { const e = ensureEntry(s, w, ex); e.w = Math.round(n * 100) / 100; }
  });
}

/* ---------- Cronòmetre de descans ---------- */
let rest = null, restTimer = null, actx = null, hideT = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
function beep() {
  try {
    unlockAudio();
    [0, 0.22, 0.44].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i === 2 ? 1046 : 784; o.connect(g); g.connect(actx.destination);
      const n = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.4, n + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.18);
      o.start(n); o.stop(n + 0.2);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function startRest(sec) {
  clearTimeout(hideT);
  rest = { end: Date.now() + sec * 1000, total: sec, fin: false };
  const el = document.getElementById("rest");
  el.hidden = false; el.classList.remove("fin");
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 250);
  tickRest();
}
function stopRest() {
  rest = null; clearInterval(restTimer); clearTimeout(hideT);
  document.getElementById("rest").hidden = true;
}
function tickRest() {
  if (!rest) return;
  const el = document.getElementById("rest");
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  if (left <= 0 && !rest.fin) {
    rest.fin = true; el.classList.add("fin"); beep();
    hideT = setTimeout(stopRest, 8000);
  }
  if (rest.fin) {
    el.querySelector(".l").textContent = "Descans acabat";
    document.getElementById("rest-t").textContent = "Toca!";
    el.querySelector(".fill").style.width = "100%";
    return;
  }
  el.querySelector(".l").textContent = "Descans";
  document.getElementById("rest-t").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  el.querySelector(".fill").style.width = Math.max(0, Math.min(100, 100 * (1 - (rest.end - Date.now()) / (rest.total * 1000)))) + "%";
}
function adjustRest(d) {
  if (!rest) return;
  if (rest.fin) { startRest(Math.max(15, d)); return; }
  rest.end += d * 1000; rest.total = Math.max(15, rest.total + d);
  tickRest();
}

/* ---------- Vistes ---------- */
function exCard(s, w, ex, idx) {
  const e = getEntry(s, w, ex.id), f = filled(e), res = result(e, ex, w), n = nSets(w);
  const open = view.open === ex.id, done = f.length >= n;
  const cw = ex.bw ? null : curWeight(s, ex, w);
  const sub = `${n} × ${ex.lo}-${ex.hi}${ex.side ? " per cama" : ""} · ${ex.bw ? "pes corporal" : (cw != null ? fmt(cw) + " kg" : "pes per indicar")} · ${f.length}/${n}`;
  let html = `<section class="ex${open ? " open" : ""}${done ? " done" : ""}" data-card="${ex.id}">
    <button class="exh" data-act="tog" data-ex="${ex.id}" aria-expanded="${open}">
      <span class="idx">${done ? svg("check") : idx + 1}</span>
      <span class="exn"><b>${esc(exName(ex, w))}</b><small>${sub}</small></span>
      ${chip(res)}
    </button>`;
  if (open) {
    const r = reference(s, ex, w), sw = suggestWeight(s, ex, w);
    let ref = "";
    if (r) {
      ref = `<div class="ref">Última vegada · setm. ${r.week}: <b>${ex.bw ? "" : fmt(r.e.w) + " kg · "}${r.e.s.filter((x) => x != null).join(" / ")}</b> ${chip(r.res)}</div>`;
    } else ref = `<div class="ref">Primera vegada. Anota el pes i les repeticions.</div>`;
    let hint = "";
    if (isDeload(w)) hint = `<div class="hint info">Setmana de descàrrega: només ${n} sèries i sense forçar.</div>`;
    else if (r && r.res === "Puja") {
      hint = ex.bw
        ? `<div class="hint good">Has arribat a ${ex.hi} reps en totes les sèries: afegeix llast o una variant més difícil.</div>`
        : `<div class="hint good">Puja a ${fmt(sw)} kg (+${fmt(ex.inc)}): vas arribar a ${ex.hi} reps en totes les sèries.</div>`;
    } else if (r && r.res === "Mantín") hint = `<div class="hint">Mantín ${ex.bw ? "" : fmt(sw) + " kg "}fins a fer ${ex.hi} reps en les 3 sèries.</div>`;
    else if (r && r.res === "Incompleta") hint = `<div class="hint">La vegada anterior no vas fer les 3 sèries. Completa-les abans de pujar.</div>`;
    let wrow;
    if (ex.bw) wrow = `<div class="bwnote">Pes corporal (sense pes a la fila)</div>`;
    else if (view.editW === ex.id) wrow = `<div class="wrow"><span></span><input class="winp" id="winp" inputmode="decimal" autocomplete="off" value="${esc(fmt(cw))}" data-wi="${ex.id}" aria-label="Pes en kg"><span></span></div>`;
    else wrow = `<div class="wrow">
        <button class="rb" data-act="w-dec" data-ex="${ex.id}" aria-label="Menys pes">${svg("minus")}</button>
        <button class="wval" data-act="w-edit" data-ex="${ex.id}" aria-label="Canvia el pes">${cw != null ? fmt(cw) : "—"}<small>kg</small></button>
        <button class="rb" data-act="w-inc" data-ex="${ex.id}" aria-label="Més pes">${svg("plus")}</button></div>`;
    let rows = "";
    for (let i = 0; i < n; i++) {
      const v = e && e.s[i] != null ? e.s[i] : null;
      const ghost = v == null;
      const shown = ghost ? defReps(s, ex, w, i) : v;
      rows += `<div class="set${ghost ? "" : " on"}">
        <span class="sl">Sèrie ${i + 1}</span>
        <button class="rb" data-act="r-dec" data-ex="${ex.id}" data-i="${i}" aria-label="Una repetició menys">${svg("minus")}</button>
        <span class="rv${ghost ? " ghost" : ""}">${shown}<small>reps</small></span>
        <button class="rb" data-act="r-inc" data-ex="${ex.id}" data-i="${i}" aria-label="Una repetició més">${svg("plus")}</button>
        <button class="ck" data-act="r-ck" data-ex="${ex.id}" data-i="${i}" aria-label="${ghost ? "Marca la sèrie " + (i + 1) + " feta" : "Desfés la sèrie " + (i + 1)}" aria-pressed="${!ghost}">${svg("check")}</button>
      </div>`;
    }
    html += `<div class="exb">${ref}${hint}${wrow}<div class="sets">${rows}</div>
      <input class="note" data-note="${ex.id}" placeholder="Nota (opcional)" value="${esc(e && e.n || "")}" aria-label="Nota de ${esc(exName(ex, w))}"></div>`;
  }
  return html + "</section>";
}

function viewTrain() {
  const { s, w } = view, P = PLAN[s], dl = isDeload(w), log = getLog(s, w), nxt = nextPending();
  const seg = ["A", "B"].map((x) => {
    const c = PLAN[x].ex.filter((ex) => exDone(x, ex, w)).length;
    return `<button data-act="sess" data-s="${x}" aria-pressed="${x === s}">${PLAN[x].name}<small>${c}/5 exercicis</small></button>`;
  }).join("");
  let html = `<div class="top"><h1>Entrena</h1>${syncHtml()}</div>
    <div class="wk">
      <button class="sq" data-act="wk-prev" aria-label="Setmana anterior" ${w <= 1 ? "disabled" : ""}>${svg("prev")}</button>
      <div class="lbl">Setmana ${w}<small>${fdate(weekStart(w))} – ${fdate(addDays(weekStart(w), 6))}${dl ? " · descàrrega" : ""}</small></div>
      <button class="sq" data-act="wk-next" aria-label="Setmana següent" ${w >= 12 ? "disabled" : ""}>${svg("next")}</button>
    </div>
    <div class="seg" role="group" aria-label="Sessió">${seg}</div>
    <div class="meta"><span class="t">${esc(P.sub)}</span>
      <label class="date"><span class="sr" hidden>Data</span><input type="date" data-date="1" value="${esc(log && log.date || today())}" aria-label="Data de la sessió"></label></div>`;
  if (dl) html += `<div class="banner">Descàrrega: ${nSets(w)} sèries per exercici. El pes surt de la setmana anterior.</div>`;
  if (nxt && (nxt.s !== s || nxt.w !== w)) {
    html += `<button class="jump" data-act="jump" data-s="${nxt.s}" data-w="${nxt.w}">Anar a la sessió següent: setmana ${nxt.w} · ${PLAN[nxt.s].name}</button>`;
  }
  html += P.ex.map((ex, i) => exCard(s, w, ex, i)).join("");
  if (sessionDone(s, w)) {
    const res = P.ex.map((ex) => result(getEntry(s, w, ex.id), ex, w));
    const ups = res.filter((r) => r === "Puja").length;
    const total = P.ex.reduce((a, ex) => a + filled(getEntry(s, w, ex.id)).length, 0);
    html += `<div class="done-card"><h3>Sessió completada</h3>
      <div>${total} sèries fetes${dl ? "" : ups ? ` · ${ups} exercici${ups > 1 ? "s" : ""} per pujar de pes la setmana vinent` : ""}.</div>
      ${nxt && (nxt.s !== s || nxt.w !== w) ? `<button class="btn full" data-act="jump" data-s="${nxt.s}" data-w="${nxt.w}">Següent: setmana ${nxt.w} · ${PLAN[nxt.s].name}</button>` : ""}</div>`;
  }
  return html;
}

function sparkline(pts) {
  const W = 300, H = 84, L = 14, R = 14, T = 8, B = 20;
  const x = (wk) => L + (wk - 1) / 11 * (W - L - R);
  let min = Math.min.apply(null, pts.map((p) => p.v)), max = Math.max.apply(null, pts.map((p) => p.v));
  if (min === max) { min -= 1; max += 1; }
  const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  let g = "";
  [4, 8, 12].forEach((d) => { g += `<rect class="band" x="${x(d) - 9}" y="${T - 4}" width="18" height="${H - T - B + 8}" rx="4" opacity=".7"/>`; });
  g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B + 4}" y2="${H - B + 4}"/>`;
  for (let k = 1; k <= 12; k++) g += `<text x="${x(k)}" y="${H - 5}" text-anchor="middle">${k}</text>`;
  g += `<polyline class="ln" points="${pts.map((p) => x(p.w).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ")}"/>`;
  pts.forEach((p) => { g += `<circle class="pt p-${RC[p.res] || "mantin"}" cx="${x(p.w).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="5"/>`; });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolució setmana a setmana">${g}</svg>`;
}

function viewProg() {
  let html = `<div class="top"><h1>Progrés</h1>${syncHtml()}</div>
    <p class="cap" style="margin:0 2px 8px">Cada punt és una setmana. Verd = va pujar, negre = es manté, groc = incompleta, blau = descàrrega.</p>`;
  ["A", "B"].forEach((s) => {
    html += `<div class="sec">${PLAN[s].name}</div>`;
    PLAN[s].ex.forEach((ex) => {
      const rows = [];
      for (let w = 1; w <= 12; w++) {
        const e = getEntry(s, w, ex.id);
        const f = filled(e);
        if (!f.length) continue;
        const v = ex.bw ? f.reduce((a, b) => a + b, 0) / f.length : e.w;
        if (v == null) continue;
        rows.push({ w, e, v, res: result(e, ex, w) });
      }
      const open = view.prog === ex.id;
      let latest = "—", cap = "Sense dades encara.";
      if (rows.length) {
        const last = rows[rows.length - 1], first = rows[0];
        latest = ex.bw ? `${Math.round(last.v * 10) / 10 > 0 ? fmt(Math.round(last.v * 10) / 10) : "0"} <small>reps mitj.</small>` : `${fmt(last.v)} <small>kg</small>`;
        const d = last.v - first.v;
        cap = rows.length < 2 ? "Una sola sessió registrada." : `${d > 0 ? "+" : ""}${fmt(Math.round(d * 10) / 10)} ${ex.bw ? "reps" : "kg"} des de la setmana ${first.w} · ${rows.length} sessions`;
      }
      html += `<div class="card"><button class="ph" data-act="prog" data-ex="${ex.id}" aria-expanded="${open}">
        <b>${esc(exName(ex, 3))}</b><span class="v">${latest}</span></button>
        ${rows.length ? sparkline(rows) : ""}<div class="cap">${cap}</div>`;
      if (open && rows.length) {
        html += `<div class="tw"><table><thead><tr><th>Setm.</th><th>Data</th><th>${ex.bw ? "" : "Pes"}</th><th>Reps</th><th></th></tr></thead><tbody>` +
          rows.slice().reverse().map((r) => `<tr><td>${r.w}</td><td>${fdate((getLog(s, r.w) || {}).date)}</td><td>${ex.bw ? "" : fmt(r.e.w) + " kg"}</td><td>${r.e.s.filter((x) => x != null).join(" / ")}</td><td>${chip(r.res)}</td></tr>`).join("") +
          `</tbody></table></div>`;
      }
      html += `</div>`;
    });
  });
  return html;
}

function viewWeeks() {
  let sessions = 0, weeksData = 0, minimes = 0, eix = 0, sense = 0;
  const cards = [];
  const cw = currentWeek();
  for (let w = 1; w <= 12; w++) {
    const k = weekStatus(w);
    sessions += k.done; if (k.estat) weeksData++;
    minimes += (k.sa === "Mínima" ? 1 : 0) + (k.sb === "Mínima" ? 1 : 0);
    if (k.eixida) eix++; if (k.estat === "Cap sessió") sense++;
    const est = k.estat === "Objectiu assolit" ? "puja" : k.estat === "Parcial" ? "inc" : k.estat === "Cap sessió" ? "inc" : "";
    cards.push(`<div class="card wcard${w === cw ? " now" : ""}">
      <div class="wtop"><h3>Setmana ${w}<small>${fdate(weekStart(w))} – ${fdate(addDays(weekStart(w), 6))}</small></h3>
        ${k.estat ? `<span class="chip c-${est}">${k.estat}</span>` : (isDeload(w) ? '<span class="chip c-desc">Descàrrega</span>' : "")}</div>
      <div class="wgrid">
        <button class="wb ${k.sa.toLowerCase()}" data-act="jump" data-s="A" data-w="${w}">Session A<small>${k.sa || "—"}</small></button>
        <button class="wb ${k.sb.toLowerCase()}" data-act="jump" data-s="B" data-w="${w}">Session B<small>${k.sb || "—"}</small></button>
        <button class="wb ${k.eixida ? "sí" : ""}" data-act="eix" data-w="${w}" aria-pressed="${k.eixida}">Eixida<small>${k.eixida ? "Sí" : "No"}</small></button>
      </div>
      <input class="note" data-wnote="${w}" placeholder="Notes de la setmana" value="${esc(k.notes)}" aria-label="Notes de la setmana ${w}"></div>`);
  }
  const adh = weeksData ? Math.round(100 * sessions / (2 * weeksData)) + "%" : "—";
  return `<div class="top"><h1>Setmanes</h1>${syncHtml()}</div>
    <div class="card"><div class="stats">
      <div class="stat"><b>${sessions}</b><span>Sessions fetes (A + B)</span></div>
      <div class="stat"><b>${adh}</b><span>Adherència (sessions / 2 per setmana)</span></div>
      <div class="stat"><b>${weeksData}</b><span>Setmanes amb dades</span></div>
      <div class="stat"><b>${minimes}</b><span>Sessions en versió mínima</span></div>
      <div class="stat"><b>${eix}</b><span>Eixides fetes</span></div>
      <div class="stat"><b>${sense}</b><span>Setmanes sense cap sessió</span></div>
    </div></div>
    <p class="cap" style="margin:0 2px 10px">Una sessió compta com «Sí» amb 4-5 exercicis anotats i com «Mínima» amb 1-3.</p>
    ${cards.join("")}`;
}

function viewData() {
  const cs = cloudState;
  const txt = cs === "ok" ? "Les dades es guarden al núvol i en aquest dispositiu." : cs === "wait" ? "Sincronitzant…" : cs === "err" ? "No s'ha pogut sincronitzar. Es reintentarà quan hi haja connexió." : "Només es guarden en aquest dispositiu. Fes còpies de seguretat.";
  return `<div class="top"><h1>Dades</h1>${syncHtml()}</div>
    <div class="card"><h3>Sincronització</h3><p class="msg" style="margin:6px 0 0">${txt}</p></div>
    <div class="card"><h3>Ajustos</h3>
      <div class="field"><span>Descans entre sèries</span></div>
      <div class="row2" role="group" aria-label="Descans entre sèries">${[60, 90, 120, 180].map((n) => `<button class="pill" data-act="rest-set" data-n="${n}" aria-pressed="${st.settings.rest === n}">${n >= 120 ? n / 60 + " min" : n + " s"}</button>`).join("")}</div>
      <div class="field"><span>Mantén la pantalla encesa</span><button class="sw" role="switch" data-act="awake" aria-checked="${!!st.settings.awake}" aria-label="Mantén la pantalla encesa"></button></div>
      <div class="field"><label for="start">Dilluns de la setmana 1</label><input id="start" type="date" data-start="1" value="${esc(st.settings.start)}"></div></div>
    <div class="card"><h3>Còpia de seguretat</h3>
      <p class="msg" style="margin:6px 0 12px">Exporta el registre o torna'l a carregar. El CSV s'obri a Excel.</p>
      <div class="row2"><button class="btn ghost" data-act="exp-json">Desa còpia (JSON)</button><button class="btn ghost" data-act="exp-csv">Exporta a Excel (CSV)</button></div>
      <div class="row2" style="margin-top:8px"><label class="btn ghost" style="display:grid;place-items:center" for="imp">Restaura una còpia</label></div>
      <input type="file" id="imp" accept=".json,application/json" hidden>
      <div class="msg" id="dmsg" role="status">${esc(dataMsg)}</div>
      ${pendingImport ? `<div class="row2" style="margin-top:8px"><button class="btn" data-act="imp-ok">Substitueix les dades actuals</button><button class="btn ghost" data-act="imp-no">Cancel·la</button></div>` : ""}</div>
    <div class="card how"><h3>Com funciona</h3>
      <p>Cada exercici té un límit alt de repeticions. Si fas el límit alt en <b>totes</b> les sèries, el resultat és <b>Puja</b> i la vegada següent l'app et suggereix 2,5 kg més al tren superior o 5 kg al tren inferior (2 kg a les manueles de press i remada, que pugen de 2 en 2). Si no, és <b>Mantín</b>.</p>
      <p>Les setmanes 4, 8 i 12 són de descàrrega: 2 sèries i resultat <b>Descàrrega</b>.</p>
      <p>Toca <b>✓</b> per marcar una sèrie amb les repeticions suggerides, o usa − i + per corregir-les. En marcar-la, arrenca el descans.</p></div>
    <div class="card"><h3>Començar de nou</h3>
      <p class="msg" style="margin:6px 0 12px">Esborra tot el registre i torna a començar de zero. Fes abans una còpia de seguretat.</p>
      ${confirmReset ? `<div class="row2"><button class="btn bad" data-act="reset-ok">Sí, esborra-ho tot</button><button class="btn ghost" data-act="reset-no">Cancel·la</button></div>` : `<button class="btn ghost full" data-act="reset">Esborra tot el registre</button>`}</div>`;
}

const syncHtml = () => {
  const m = { ok: ["ok", "Sincronitzat"], wait: ["wait", "Sincronitzant"], err: ["err", "Sense sincronitzar"], local: ["", "Només al mòbil"] }[cloudState];
  return `<span class="sync ${m[0]}"><i></i>${m[1]}</span>`;
};

/* ---------- Render ---------- */
const TABS = [["train", "Entrena", "train"], ["prog", "Progrés", "prog"], ["weeks", "Setmanes", "weeks"], ["data", "Dades", "data"]];
function render() {
  const v = document.getElementById("view");
  v.innerHTML = view.tab === "train" ? viewTrain() : view.tab === "prog" ? viewProg() : view.tab === "weeks" ? viewWeeks() : viewData();
  document.getElementById("tabs").innerHTML = TABS.map((t) =>
    `<button data-act="tab" data-tab="${t[0]}" ${view.tab === t[0] ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t[2]]}</svg>${t[1]}</button>`).join("");
  const wi = document.getElementById("winp");
  if (wi) { wi.focus(); wi.select(); }
}
function autoOpen() {
  const ex = PLAN[view.s].ex.find((x) => !exDone(view.s, x, view.w));
  view.open = ex ? ex.id : null;
}
function goSession(s, w) {
  view.tab = "train"; view.s = s; view.w = w; view.editW = null; autoOpen(); render(); window.scrollTo(0, 0);
}

/* ---------- Esdeveniments ---------- */
let dataMsg = "", pendingImport = null, confirmReset = false;
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.ex, i = parseInt(t.dataset.i, 10);
  switch (a) {
    case "tab": view.tab = t.dataset.tab; confirmReset = false; render(); window.scrollTo(0, 0); break;
    case "tog": view.open = view.open === id ? null : id; view.editW = null; render(); break;
    case "wk-prev": goSession(view.s, Math.max(1, view.w - 1)); break;
    case "wk-next": goSession(view.s, Math.min(12, view.w + 1)); break;
    case "sess": goSession(t.dataset.s, view.w); break;
    case "jump": goSession(t.dataset.s, parseInt(t.dataset.w, 10)); break;
    case "r-ck": setReps(id, i, "ck", 0); break;
    case "r-inc": setReps(id, i, "adj", 1); break;
    case "r-dec": setReps(id, i, "adj", -1); break;
    case "w-inc": stepWeight(id, 1); break;
    case "w-dec": stepWeight(id, -1); break;
    case "w-edit": view.editW = id; render(); break;
    case "prog": view.prog = view.prog === id ? null : id; render(); break;
    case "eix": mutate((s) => { const k = t.dataset.w; s.weeks[k] = s.weeks[k] || { eixida: false, notes: "" }; s.weeks[k].eixida = !s.weeks[k].eixida; }); break;
    case "rest-add": adjustRest(15); break;
    case "rest-sub": adjustRest(-15); break;
    case "rest-skip": stopRest(); break;
    case "rest-set": mutate((s) => { s.settings.rest = parseInt(t.dataset.n, 10); }); break;
    case "awake": mutate((s) => { s.settings.awake = !s.settings.awake; }); keepAwake(); break;
    case "exp-json": exportFile("gym-log-" + today() + ".json", JSON.stringify(st, null, 1)); break;
    case "exp-csv": exportFile("gym-log-" + today() + ".csv", buildCsv()); break;
    case "imp-ok": mutate((s) => { Object.assign(s, pendingImport); }); pendingImport = null; dataMsg = "Còpia restaurada."; render(); break;
    case "imp-no": pendingImport = null; dataMsg = ""; render(); break;
    case "reset": confirmReset = true; render(); break;
    case "reset-no": confirmReset = false; render(); break;
    case "reset-ok": confirmReset = false; mutate((s) => { Object.assign(s, seedState()); }); { const nx = nextPending(); view.s = nx ? nx.s : "A"; view.w = nx ? nx.w : 1; } dataMsg = "Registre esborrat."; render(); break;
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.wi) { commitWeight(t.dataset.wi, t.value); return; }
  if (t.dataset.note) {
    const { s, w } = view, ex = findEx(t.dataset.note);
    mutate(() => { ensureEntry(s, w, ex).n = t.value.trim(); }, { render: false });
  } else if (t.dataset.wnote) {
    mutate((x) => { const k = t.dataset.wnote; x.weeks[k] = x.weeks[k] || { eixida: false, notes: "" }; x.weeks[k].notes = t.value.trim(); }, { render: false });
  } else if (t.dataset.date) {
    if (t.value) mutate(() => { const k = view.s + "-" + view.w; st.logs[k] = st.logs[k] || { ex: {} }; st.logs[k].date = t.value; }, { render: false });
  } else if (t.dataset.start) {
    if (t.value) mutate((x) => { x.settings.start = t.value; });
  } else if (t.id === "imp") readImport(t.files && t.files[0]);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches("input")) ev.target.blur();
});
document.addEventListener("focusout", (ev) => {
  if (ev.target.dataset && ev.target.dataset.wi && view.editW) {
    const id = ev.target.dataset.wi, val = ev.target.value;
    setTimeout(() => { if (view.editW === id) commitWeight(id, val); }, 0);
  }
});

/* ---------- Còpia de seguretat ---------- */
function buildCsv() {
  const q = (x) => { const s = x == null ? "" : String(x); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [["Sessió", "Setmana", "Data", "Exercici", "Pes (kg)", "Set 1", "Set 2", "Set 3", "Resultat", "Notes"]];
  for (let w = 1; w <= 12; w++) ["A", "B"].forEach((s) => PLAN[s].ex.forEach((ex) => {
    const e = getEntry(s, w, ex.id);
    if (!filled(e).length) return;
    rows.push([PLAN[s].name, w, (getLog(s, w) || {}).date || "", exName(ex, w), ex.bw ? "" : fmt(e.w), e.s[0] == null ? "" : e.s[0], e.s[1] == null ? "" : e.s[1], isDeload(w) ? "" : (e.s[2] == null ? "" : e.s[2]), result(e, ex, w), e.n || ""]);
  }));
  return "﻿" + rows.map((r) => r.map(q).join(";")).join("\n");
}
async function exportFile(name, data) {
  const mime = /\.csv$/.test(name) ? "text/csv" : "application/json";
  try {
    let dl = null;
    try { dl = window.claude && await window.claude.use("downloads"); } catch (e) { dl = null; }
    if (dl) { await dl.save({ filename: name, data }); dataMsg = "Fitxer desat: " + name; }
    else {
      const file = new File([data], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        dataMsg = "Fitxer compartit: " + name;
      } else {
        const url = URL.createObjectURL(new Blob([data], { type: mime }));
        const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        dataMsg = "Fitxer baixat: " + name;
      }
    }
  } catch (e) {
    if (e && (e.code === "declined" || e.name === "AbortError")) dataMsg = "Has cancel·lat el desat.";
    else {
      try { await navigator.clipboard.writeText(data); dataMsg = "No es pot baixar des d'ací. He copiat el contingut al porta-retalls."; }
      catch (e2) { dataMsg = "No s'ha pogut exportar des d'aquesta vista."; }
    }
  }
  if (view.tab === "data") render();
}
function readImport(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = normalize(JSON.parse(r.result));
      if (!o) throw new Error("format");
      pendingImport = o; dataMsg = "Fitxer llegit: " + Object.keys(o.logs).length + " sessions. Confirma per substituir les dades actuals.";
    } catch (e) { pendingImport = null; dataMsg = "Aquest fitxer no és una còpia vàlida."; }
    render();
  };
  r.readAsText(file);
}

/* ---------- Pantalla encesa ---------- */
let wl = null;
async function keepAwake() {
  try {
    if (!st.settings.awake) { if (wl) { await wl.release(); wl = null; } return; }
    if (!wl && navigator.wakeLock && document.visibilityState === "visible") {
      wl = await navigator.wakeLock.request("screen");
      wl.addEventListener("release", () => { wl = null; });
    }
  } catch (e) { wl = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); tickRest(); } });
document.addEventListener("pointerdown", () => { if (!wl) keepAwake(); }, { once: true });

/* ---------- Núvol (opcional, la còpia local mana) ---------- */
let cloudState = "local", dbDoc = null, pushT = null, pushing = false, pushAgain = false;
function scheduleCloud() {
  if (!dbDoc) return;
  cloudState = "wait"; refreshSync();
  clearTimeout(pushT);
  pushT = setTimeout(pushCloud, 800);
}
async function pushCloud() {
  if (!dbDoc) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  const stamp = st.updatedAt;
  try {
    await dbDoc.set({ updatedAt: stamp, payload: JSON.stringify(st) });
    cloudState = stamp === st.updatedAt ? "ok" : "wait";
  } catch (e) {
    cloudState = "err"; clearTimeout(pushT); pushT = setTimeout(pushCloud, 8000);
  }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushCloud(); }
  refreshSync();
}
function refreshSync() {
  document.querySelectorAll(".sync").forEach((el) => { el.outerHTML = syncHtml(); });
  if (view.tab === "data" && !document.activeElement.matches("input")) render();
}
let deferredRemote = null;
function adopt(o) {
  st = o; saveLocal(); cloudState = "ok";
  if (document.activeElement && document.activeElement.matches("input")) { deferredRemote = null; refreshSync(); return; }
  render();
}
function onRemote(snap) {
  if (!snap.exists) { pushCloud(); return; }
  const d = snap.data();
  if (d.updatedAt > st.updatedAt) {
    try { const o = normalize(JSON.parse(d.payload)); if (o) { o.updatedAt = d.updatedAt; adopt(o); } } catch (e) {}
  } else if (d.updatedAt < st.updatedAt) { scheduleCloud(); }
  else { cloudState = "ok"; refreshSync(); }
}
async function initCloud() {
  try {
    const db = await window.claude.use("db");
    if (!db) return;
    dbDoc = db.doc("app/state");
    cloudState = "wait"; refreshSync();
    dbDoc.onSnapshot(onRemote, () => { cloudState = "err"; refreshSync(); });
  } catch (e) { /* sense núvol */ }
}
window.addEventListener("online", () => { if (dbDoc && cloudState === "err") pushCloud(); });

/* ---------- Inici ---------- */
(function init() {
  const nx = nextPending();
  view.s = nx ? nx.s : "B"; view.w = nx ? nx.w : 12;
  autoOpen();
  saveLocal();
  render();
  keepAwake();
  if (window.claude && window.claude.use) initCloud();
})();

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body></html>
